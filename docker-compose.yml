services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - radar-pg:/var/lib/postgresql/data

volumes:
  radar-pg:
